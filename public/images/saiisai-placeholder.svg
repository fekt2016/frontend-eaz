<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle glow circle -->
  <circle cx="600" cy="315" r="280" fill="url(#glow)"/>

  <!-- Grid pattern -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#334155" stroke-width="0.5"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.4"/>

  <!-- Top browser bar -->
  <rect x="200" y="80" width="800" height="44" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="228" cy="102" r="6" fill="#ef4444" opacity="0.7"/>
  <circle cx="250" cy="102" r="6" fill="#f59e0b" opacity="0.7"/>
  <circle cx="272" cy="102" r="6" fill="#22c55e" opacity="0.7"/>
  <rect x="300" y="90" width="500" height="24" rx="4" fill="#0f172a"/>
  <text x="550" y="107" font-family="monospace" font-size="12" fill="#64748b" text-anchor="middle">saiisai.com</text>

  <!-- Lock icon next to URL -->
  <text x="310" y="107" font-family="monospace" font-size="11" fill="#64748b">🔒</text>

  <!-- Main content area -->
  <rect x="200" y="140" width="800" height="400" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>

  <!-- Maintenance icon container -->
  <circle cx="600" cy="290" r="56" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>

  <!-- Wrench/tools SVG path -->
  <text x="600" y="305" font-family="Arial" font-size="44" text-anchor="middle" fill="#f59e0b">🔧</text>

  <!-- SaiSai branding -->
  <text x="600" y="382" font-family="Arial, sans-serif" font-weight="800" font-size="32" fill="#f8fafc" text-anchor="middle" letter-spacing="2">SaiSai</text>
  <text x="600" y="414" font-family="Arial, sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">We'll be back shortly — site under maintenance</text>

  <!-- Status badge -->
  <rect x="520" y="435" width="160" height="30" rx="15" fill="#f59e0b" opacity="0.15"/>
  <circle cx="540" cy="450" r="5" fill="#f59e0b"/>
  <text x="600" y="455" font-family="Arial, sans-serif" font-size="13" fill="#f59e0b" text-anchor="middle">Under Maintenance</text>

  <!-- EazWorld credit -->
  <text x="600" y="565" font-family="Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle">Built by EazWorld · eazworld.co</text>
</svg>
