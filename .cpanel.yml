---
# cPanel Git Version Control deployment — Namecheap cPanel reseller plan.
#
# Next.js runs under Phusion Passenger via cPanel's "Setup Node.js App"
# (Application root ~/eazworld.co, startup file node_modules/.bin/next, `start`).
# There is no PM2 and no Nginx on a shared plan — see backend-eaz/docs/HOSTING.md.
#
# BUILD POLICY: `next build` is NOT run here — a failure mid-deploy would leave
# the live site with a half-copied .next.
#
# Build OVER SSH, in place. .next/ is gitignored, so building locally does NOT
# get the build onto the server; only an in-place build does:
#
#   ssh <cpanel-user>@<server>.web-hosting.com
#   cd ~/repositories/frontend-eaz && npm ci && npm run build
#
# Then Deploy HEAD Commit in cPanel. If .next is absent the copy below is a no-op
# and Passenger keeps serving the previous build — deliberately, so a botched
# deploy degrades to "stale" rather than "down".

deployment:
  tasks:
    - export DEPLOYPATH=/home/$(whoami)/eazworld.co/
    - /bin/mkdir -p $DEPLOYPATH/tmp

    - /bin/cp -R package.json package-lock.json next.config.mjs jsconfig.json tailwind.config.js postcss.config.mjs $DEPLOYPATH 2>/dev/null || true
    - /bin/cp -R public src $DEPLOYPATH
    - /bin/cp -R .next $DEPLOYPATH 2>/dev/null || true

    # Next.js needs its build-time deps present at runtime, so this is a full
    # install rather than --omit=dev.
    - cd $DEPLOYPATH && /bin/npm ci

    - /bin/touch $DEPLOYPATH/tmp/restart.txt
